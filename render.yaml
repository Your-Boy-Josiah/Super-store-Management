services:
  - type: web
    name: super-store-management
    runtime: node
    plan: starter
    buildCommand: npm ci && npm ci --prefix frontend && npm run build:frontend
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: product-images
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: ALLOW_PUBLIC_SIGNUP
        value: false
